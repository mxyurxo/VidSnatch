<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSnatch</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="#7c3aed"/>
          <path d="M10 8L20 14L10 20V8Z" fill="white"/>
        </svg>
        <span class="logo-text">VidSnatch</span>
      </div>
      <span class="version">v1.1</span>
    </header>

    <div class="page-info" id="pageInfo">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <circle cx="7" cy="7" r="6" stroke="#666" stroke-width="1.5"/>
        <path d="M7 4V7.5L9.5 9" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="page-domain" id="pageDomain">Loading...</span>
    </div>

    <div class="video-list" id="videoList">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect x="6" y="10" width="36" height="28" rx="4" stroke="#444" stroke-width="2"/>
            <path d="M20 18L30 24L20 30V18Z" fill="#444"/>
          </svg>
        </div>
        <p class="empty-title">No videos detected</p>
        <p class="empty-subtitle">Play or load a video on this page</p>
      </div>
    </div>

    <footer class="footer">
      <span class="footer-text" id="videoCount">0 videos found</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
